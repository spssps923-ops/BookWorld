<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Фентезі — BookWorld</title>

    <link rel="stylesheet" href="style.css">

    <!-- Бібліотека Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Підключення Supabase BookWorld -->
    <script src="supabase.js"></script>

</head>

<body>

<header class="header">

    <div class="logo">
        📚 BookWorld
    </div>

    <div>

        <a href="index.html" class="cart-button">
            🏠 Головна
        </a>

        <a href="cart.html" class="cart-button" id="cart-link">
            🛒 Кошик
        </a>

    </div>

</header>


<main>

    <h1>🐉 Фентезі</h1>

    <p class="description">
        Магія, дракони, чарівні світи та неймовірні пригоди
    </p>

    <div class="books-grid" id="books"></div>

</main>


<footer>
    BookWorld © 2026
</footer>


<!-- Загальна система BookWorld -->
<script src="script.js"></script>


<script>

// ==========================================
// ОТРИМАННЯ КНИГ ФЕНТЕЗІ
// ==========================================

async function getFantasyBooks() {

    try {

        const dbFantasy =
            window.BookWorldSupabase;


        // Знаходимо жанр Фентезі
        const { data: genre, error: genreError } =
            await dbFantasy
                .from("genres")
                .select("id")
                .eq("code", "fantasy")
                .maybeSingle();


        if (genreError) {

            console.error(
                "Помилка отримання жанру:",
                genreError
            );

            return [];

        }


        if (!genre) {

            console.error(
                "Жанр fantasy не знайдено."
            );

            return [];

        }


        // Отримуємо книги жанру
        const { data: books, error: booksError } =
            await dbFantasy
                .from("books")
                .select("*")
                .eq("genre_id", genre.id)
                .eq("is_deleted", false)
                .order("created_at", {
                    ascending: true
                });


        if (booksError) {

            console.error(
                "Помилка отримання книг:",
                booksError
            );

            return [];

        }


        return books || [];

    }

    catch (error) {

        console.error(
            "Помилка Supabase:",
            error
        );

        return [];

    }

}


// ==========================================
// БЕЗПЕЧНИЙ ВИВІД ТЕКСТУ
// ==========================================

function escapeFantasyHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// СТВОРЕННЯ КАРТКИ КНИГИ
// ==========================================

function createFantasyCard(
    book,
    quantity
) {

    const bookId =
        book.book_code;


    // ==========================================
    // ОБКЛАДИНКА
    // ==========================================

    let cover =
        book.image_url || "📖";


    if (
        typeof cover === "string" &&
        (
            cover.startsWith("http://") ||
            cover.startsWith("https://")
        )
    ) {

        cover = `
            <img
                src="${escapeFantasyHTML(cover)}"
                alt="${escapeFantasyHTML(book.title || "Обкладинка книги")}"
            >
        `;

    }


    // ==========================================
    // КАРТКА
    // ==========================================

    const card =
        document.createElement("div");


    card.className =
        "book-card";


    card.dataset.bookId =
        bookId;


    card.innerHTML = `

        <div class="book-cover">
            ${cover}
        </div>

        <h2>
            ${escapeFantasyHTML(book.title || "Без назви")}
        </h2>

        <p>
            ${escapeFantasyHTML(book.author || "Автор невідомий")}
        </p>

        ${
            book.price !== null &&
            book.price !== undefined
                ? `
                    <p class="book-price">
                        ${book.price} грн
                    </p>
                `
                : ""
        }

        <button
            class="add-to-cart"
            type="button"
        >
            🛒 Додати до кошика
            ${quantity > 0 ? `(${quantity})` : ""}
        </button>

        ${
            quantity > 0
                ? `
                    <button
                        class="remove-from-cart"
                        type="button"
                    >
                        ➖ Прибрати одну
                    </button>
                `
                : ""
        }

    `;


    // ==========================================
    // КНОПКА ДОДАВАННЯ
    // ==========================================

    const addButton =
        card.querySelector(".add-to-cart");


    addButton.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();

            await addFantasyBook(
                bookId,
                card
            );

        }
    );


    // ==========================================
    // КНОПКА ПРИБИРАННЯ
    // ==========================================

    const removeButton =
        card.querySelector(".remove-from-cart");


    if (removeButton) {

        removeButton.addEventListener(
            "click",
            async function(event) {

                event.stopPropagation();

                await removeFantasyBook(
                    bookId,
                    card
                );

            }
        );

    }


    // ==========================================
    // ВІДКРИТТЯ СТОРІНКИ КНИГИ
    // ==========================================

    card.addEventListener(
        "click",
        function() {

            window.location.href =
                "book.html?id=" +
                encodeURIComponent(bookId);

        }
    );


    return card;

}


// ==========================================
// ПОЧАТКОВЕ ВІДОБРАЖЕННЯ КНИГ
// ==========================================

async function renderFantasyBooks() {

    const container =
        document.getElementById("books");


    container.innerHTML =
        "<p>📚 Завантаження книг...</p>";


    const books =
        await getFantasyBooks();


    const cart =
        await BookWorld.getCart();


    container.innerHTML = "";


    // Якщо книг немає
    if (books.length === 0) {

        container.innerHTML =
            "<p>У цьому жанрі поки немає книг.</p>";

        BookWorld.updateCartLinks();

        return;

    }


    // Створюємо картки
    books.forEach(function(book) {

        const quantity =
            cart[book.book_code] || 0;


        const card =
            createFantasyCard(
                book,
                quantity
            );


        container.appendChild(card);

    });


    BookWorld.updateCartLinks();

}


// ==========================================
// ОНОВЛЕННЯ ТІЛЬКИ ОДНІЄЇ КАРТКИ
// ==========================================

async function updateFantasyCard(
    id,
    oldCard
) {

    const dbFantasy =
        window.BookWorldSupabase;


    // Отримуємо актуальну книгу
    const { data: book, error } =
        await dbFantasy
            .from("books")
            .select("*")
            .eq("book_code", id)
            .eq("is_deleted", false)
            .single();


    if (error || !book) {

        console.error(
            "Не вдалося оновити картку:",
            error
        );

        return;

    }


    // Отримуємо актуальний кошик
    const cart =
        await BookWorld.getCart();


    const quantity =
        cart[id] || 0;


    // Створюємо нову картку
    const newCard =
        createFantasyCard(
            book,
            quantity
        );


    // Замінюємо тільки потрібну картку
    oldCard.replaceWith(newCard);


    // Оновлюємо кошик у шапці
    BookWorld.updateCartLinks();

}


// ==========================================
// ДОДАТИ ДО КОШИКА
// ==========================================

async function addFantasyBook(
    id,
    card
) {

    const success =
        await BookWorld.addToCart(id);


    if (success) {

        await updateFantasyCard(
            id,
            card
        );

    }

}


// ==========================================
// ПРИБРАТИ ОДНУ КНИГУ
// ==========================================

async function removeFantasyBook(
    id,
    card
) {

    const success =
        await BookWorld.removeFromCart(id);


    if (success) {

        await updateFantasyCard(
            id,
            card
        );

    }

}


// ==========================================
// ЗАПУСК
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        BookWorld.updateCartLinks();

        renderFantasyBooks();

    }
);

</script>

</body>
</html>
