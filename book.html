<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Книга — BookWorld</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Підключення BookWorld до Supabase -->
    <script src="supabase.js"></script>

    <style>

        body {
            overflow-x: hidden;
        }

        .book-page {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .book-container {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .book-top {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 30px;
            align-items: start;
            min-width: 0;
        }

        .book-image {
            width: 100%;
            max-width: 300px;
            min-height: 400px;
            border-radius: 14px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book-image img {
            width: 100%;
            height: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }

        .book-info {
            min-width: 0;
            max-width: 100%;
        }

        .book-info h1 {
            margin-top: 0;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .book-author {
            color: #666;
            font-size: 17px;
            margin-bottom: 20px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .book-description {
            margin-top: 20px;
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-wrap: break-word;
            word-break: break-word;
            white-space: normal;
            box-sizing: border-box;
        }

        .book-description * {
            box-sizing: border-box;
            max-width: 100% !important;
            min-width: 0 !important;
            overflow-wrap: anywhere !important;
            word-wrap: break-word !important;
            word-break: break-word !important;
            white-space: normal !important;
        }

        .book-description p,
        .book-description div,
        .book-description span {
            width: auto !important;
            max-width: 100% !important;
            min-width: 0 !important;
        }

        .book-description p {
            margin: 0 0 10px;
        }

        .book-description a {
            color: #6a11cb;
            text-decoration: underline;
        }

        .book-description ul,
        .book-description ol {
            padding-left: 30px;
            margin-top: 8px;
            margin-bottom: 12px;
            max-width: calc(100% - 10px);
        }

        .book-description li {
            margin-bottom: 5px;
        }

        .book-description h1,
        .book-description h2,
        .book-description h3,
        .book-description h4 {
            color: #333;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .book-description blockquote {
            margin: 15px 0;
            padding: 10px 15px;
            border-left: 4px solid #6a11cb;
            color: #666;
            max-width: 100%;
        }

        .book-description img {
            display: block;
            max-width: 100% !important;
            width: auto !important;
            height: auto !important;
        }

        .book-description table {
            display: block;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }

        .book-description pre {
            max-width: 100%;
            white-space: pre-wrap !important;
            overflow-wrap: anywhere !important;
            word-break: break-word !important;
        }

        .book-details {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .detail {
            background: #f7f7f7;
            padding: 10px 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .detail strong {
            color: #333;
        }

        .book-price {
            margin-top: 25px;
            font-size: 25px;
            font-weight: bold;
            color: #6a11cb;
        }

        .book-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .book-buttons button,
        .book-buttons a {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
        }

        .buy-button {
            background: linear-gradient(135deg, #6a11cb, #e83e8c);
            color: white;
        }

        .cart-button-book {
            background: #eee5ff;
            color: #6a11cb;
        }

        .cart-button-book.added {
            background: #e8f8ed;
            color: #218838;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 15px;
            color: #6a11cb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .book-page {
                padding: 0 12px;
                margin: 20px auto;
            }

            .book-container {
                padding: 15px;
            }

            .book-top {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .book-image {
                max-width: 100%;
                margin: 0 auto;
            }

            .book-info {
                min-width: 0;
                width: 100%;
            }

            .book-info h1 {
                font-size: 25px;
            }

            .book-details {
                grid-template-columns: 1fr;
            }

            .book-description {
                font-size: 15px;
                line-height: 1.6;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        📚 BookWorld
    </div>

    <div>

        <a href="index.html" class="cart-button">
            🏠 Головна
        </a>

        <a href="cart.html" class="cart-button" id="cart-link">
            🛒 Кошик
        </a>

    </div>

</header>


<main class="book-page">

    <a href="javascript:history.back()" class="back-button">
        ← Назад
    </a>

    <div class="book-container">

        <div id="book-content" class="book-top">

            <p>
                📚 Завантаження книги...
            </p>

        </div>

    </div>

</main>


<footer>
    BookWorld © 2026
</footer>


<!-- Основний JavaScript -->
<script src="script.js"></script>


<script>

    // ==========================================
    // URL КНИГИ
    // ==========================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const bookId =
        params.get("id");


    // ==========================================
    // ОТРИМАННЯ КНИГИ
    // ==========================================

    async function getBook(id) {

        if (!id) {
            return null;
        }

        const result =
            await window.BookWorldSupabase
                .from("books")
                .select("*")
                .eq("book_code", id)
                .eq("is_deleted", false)
                .maybeSingle();


        if (result.error) {

            console.error(
                "Помилка отримання книги:",
                result.error
            );

            return null;

        }


        return result.data;

    }


    // ==========================================
    // ОНОВЛЕННЯ ТІЛЬКИ КНОПКИ
    // ==========================================

    function updateCartButton(quantity) {

        const button =
            document.getElementById(
                "add-cart-button"
            );


        if (!button) {
            return;
        }


        if (quantity > 0) {

            button.textContent =
                `🛒 У кошику (${quantity})`;

            button.classList.add("added");

        }

        else {

            button.textContent =
                "🛒 Додати в кошик";

            button.classList.remove("added");

        }

    }


    // ==========================================
    // ДОДАВАННЯ ДО КОШИКА
    // ==========================================

    async function addToCart() {

        if (!bookId) {
            return;
        }


        const button =
            document.getElementById(
                "add-cart-button"
            );


        if (button) {
            button.disabled = true;
        }


        try {

            const result =
                await BookWorld.addToCart(bookId);


            if (result) {

                const cart =
                    await BookWorld.getCart();


                const quantity =
                    cart[bookId] || 0;


                // Змінюємо тільки кнопку
                updateCartButton(quantity);


                // Оновлюємо тільки лічильник кошика
                await BookWorld.updateCartLinks();


                BookWorld.showToast(
                    "Книгу додано до кошика 🛒",
                    "success"
                );

            }

        }

        finally {

            if (button) {
                button.disabled = false;
            }

        }

    }


    // ==========================================
    // ВІДОБРАЖЕННЯ КНИГИ
    // ==========================================

    async function renderBook() {

        const container =
            document.getElementById(
                "book-content"
            );


        const book =
            await getBook(bookId);


        if (!book) {

            container.innerHTML = `

                <div>

                    <h1>
                        Книгу не знайдено 😔
                    </h1>

                    <p>
                        Можливо, її було видалено
                        або такого ID не існує.
                    </p>

                </div>

            `;

            return;

        }


        // ==========================================
        // ОБКЛАДИНКА
        // ==========================================

        let imageHTML = "";


        if (book.image_url) {

            const imageURL =
                String(book.image_url).trim();


            if (
                imageURL.startsWith("http://") ||
                imageURL.startsWith("https://")
            ) {

                imageHTML = `

                    <img
                        src="${imageURL}"
                        alt="${book.title}"
                        onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;font-size:80px;&quot;>📖</span>';"

                    >

                `;

            }

            else {

                imageHTML = `

                    <span style="font-size:80px;">
                        ${imageURL}
                    </span>

                `;

            }

        }

        else {

            imageHTML = `

                <span style="font-size:80px;">
                    📖
                </span>

            `;

        }


        // ==========================================
        // ОПИС
        // ==========================================

        const description =
            book.description &&
            String(book.description).trim()
                ? book.description
                : "Опис книги відсутній.";


        // ==========================================
        // ЖАНР
        // ==========================================

        let genreName = "—";


        if (book.genre_id) {

            const genreResult =
                await window.BookWorldSupabase
                    .from("genres")
                    .select("name")
                    .eq("id", book.genre_id)
                    .maybeSingle();


            if (
                genreResult.data &&
                genreResult.data.name
            ) {

                genreName =
                    genreResult.data.name;

            }

        }


        // ==========================================
        // HTML КНИГИ
        // ==========================================

        container.innerHTML = `

            <div class="book-image">

                ${imageHTML}

            </div>


            <div class="book-info">

                <h1>
                    ${book.title}
                </h1>


                <div class="book-author">

                    👤 ${book.author || "Автор невідомий"}

                </div>


                <div class="book-description">

                    ${description}

                </div>


                <div class="book-details">

                    <div class="detail">
                        <strong>Жанр:</strong>
                        ${genreName}
                    </div>

                    <div class="detail">
                        <strong>Рік:</strong>
                        ${book.year ?? "—"}
                    </div>

                    <div class="detail">
                        <strong>Сторінки:</strong>
                        ${book.pages ?? "—"}
                    </div>

                    <div class="detail">
                        <strong>Мова:</strong>
                        ${book.language || "—"}
                    </div>

                    <div class="detail">
                        <strong>Видавництво:</strong>
                        ${book.publisher || "—"}
                    </div>

                    <div class="detail">
                        <strong>ISBN:</strong>
                        ${book.isbn || "—"}
                    </div>

                    <div class="detail">
                        <strong>Рейтинг:</strong>
                        ${book.rating ?? "—"}
                    </div>

                    <div class="detail">
                        <strong>Серія:</strong>
                        ${book.series || "—"}
                    </div>

                </div>


                ${
                    book.price !== null &&
                    book.price !== undefined &&
                    book.price !== ""
                        ? `
                            <div class="book-price">
                                ${book.price} грн
                            </div>
                        `
                        : ""
                }


                <div class="book-buttons">

                    <button
                        class="cart-button-book"
                        id="add-cart-button"
                        type="button"
                    >
                        🛒 Додати в кошик
                    </button>


                    ${
                        book.buy_link
                            ? `
                                <a
                                    href="${book.buy_link}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="buy-button"
                                >
                                    🛍️ Купити
                                </a>
                            `
                            : ""
                    }

                </div>

            </div>

        `;


        // ==========================================
        // ПОЧАТКОВА КІЛЬКІСТЬ У КОШИКУ
        // ==========================================

        const cart =
            await BookWorld.getCart();


        const quantity =
            cart[bookId] || 0;


        updateCartButton(quantity);


        // ==========================================
        // КНОПКА
        // ==========================================

        const cartButton =
            document.getElementById(
                "add-cart-button"
            );


        if (cartButton) {

            cartButton.addEventListener(
                "click",
                addToCart
            );

        }


        // Оновлюємо лічильник кошика
        await BookWorld.updateCartLinks();

    }


    // ==========================================
    // ЗАПУСК
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            renderBook();

        }
    );

</script>


</body>
</html>
