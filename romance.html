<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Романтика — BookWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        📚 BookWorld
    </div>

    <div>

        <a href="index.html" class="cart-button">
            🏠 Головна
        </a>

        <a href="cart.html" class="cart-button" id="cart-link">
            🛒 Кошик
        </a>

    </div>

</header>


<main>

    <h1>❤️ Романтика</h1>

    <p class="description">
        Кохання, почуття, стосунки та незабутні історії
    </p>

    <div class="books-grid" id="books"></div>

</main>


<footer>
    BookWorld © 2026
</footer>


<!-- ==========================================
     SUPABASE
     ========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- ==========================================
     ОСНОВНИЙ СКРИПТ BOOKWORLD
     ========================================== -->

<script src="script.js"></script>


<script>

    // ==========================================
    // ОТРИМАННЯ КНИГ РОМАНТИЧНОГО ЖАНРУ
    // ==========================================

    async function getRomanceBooks() {

        try {

            const dbRomance =
                window.BookWorldSupabase;

            // Знаходимо жанр за кодом
            const { data: genre, error: genreError } =
                await dbRomance
                    .from("genres")
                    .select("id")
                    .eq("code", "romance")
                    .single();

            if (genreError) {

                console.error(
                    "Помилка отримання жанру:",
                    genreError
                );

                return [];

            }

            // Отримуємо книги цього жанру
            const { data: books, error: booksError } =
                await dbRomance
                    .from("books")
                    .select("*")
                    .eq("genre_id", genre.id)
                    .eq("is_deleted", false)
                    .order("created_at", {
                        ascending: true
                    });

            if (booksError) {

                console.error(
                    "Помилка отримання книг:",
                    booksError
                );

                return [];

            }

            return books || [];

        }

        catch (error) {

            console.error(
                "Помилка Supabase:",
                error
            );

            return [];

        }

    }


    // ==========================================
    // ЕКРАНУВАННЯ HTML
    // ==========================================

    function escapeRomanceHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // СТВОРЕННЯ КАРТКИ КНИГИ
    // ==========================================

    function createRomanceCard(book, quantity) {

        const card =
            document.createElement("div");

        card.className =
            "book-card";

        const title =
            escapeRomanceHTML(book.title);

        const author =
            escapeRomanceHTML(
                book.author || "Автор невідомий"
            );

        let cover =
            book.image_url || "📖";

        if (
            typeof cover === "string" &&
            (
                cover.startsWith("http://") ||
                cover.startsWith("https://")
            )
        ) {

            cover = `
                <img
                    src="${escapeRomanceHTML(cover)}"
                    alt="${title}"
                >
            `;

        }

        else {

            cover =
                escapeRomanceHTML(cover);

        }


        card.innerHTML = `

            <div class="book-cover">
                ${cover}
            </div>

            <h2>
                ${title}
            </h2>

            <p>
                ${author}
            </p>

            ${
                book.price != null
                    ? `
                        <p class="book-price">
                            ${book.price} грн
                        </p>
                    `
                    : ""
            }

            <button
                type="button"
                class="add-to-cart"
            >
                🛒 Додати до кошика
                ${quantity > 0 ? `(${quantity})` : ""}
            </button>

            ${
                quantity > 0
                    ? `
                        <button
                            type="button"
                            class="remove-from-cart"
                        >
                            ➖ Прибрати одну
                        </button>
                    `
                    : ""
            }

        `;


        // ==========================================
        // КНОПКА ДОДАВАННЯ
        // ==========================================

        const addButton =
            card.querySelector(".add-to-cart");

        addButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                addRomanceBook(
                    book.book_code,
                    card
                );

            }
        );


        // ==========================================
        // КНОПКА ВИДАЛЕННЯ
        // ==========================================

        const removeButton =
            card.querySelector(".remove-from-cart");

        if (removeButton) {

            removeButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    removeRomanceBook(
                        book.book_code,
                        card
                    );

                }
            );

        }


        // ==========================================
        // ПЕРЕХІД НА СТОРІНКУ КНИГИ
        // ==========================================

        card.addEventListener(
            "click",
            function () {

                window.location.href =
                    "book.html?id=" +
                    encodeURIComponent(
                        book.book_code
                    );

            }
        );


        return card;

    }


    // ==========================================
    // ОНОВЛЕННЯ ОДНІЄЇ КАРТКИ
    // ==========================================

    async function updateRomanceCard(
        id,
        oldCard
    ) {

        const dbRomance =
            window.BookWorldSupabase;


        // Отримуємо актуальну книгу
        const { data: book, error: bookError } =
            await dbRomance
                .from("books")
                .select("*")
                .eq("book_code", id)
                .eq("is_deleted", false)
                .single();


        if (bookError || !book) {

            console.error(
                "Не вдалося отримати книгу:",
                bookError
            );

            return;

        }


        // Отримуємо актуальний кошик
        const cart =
            await BookWorld.getCart();


        const quantity =
            cart[id] || 0;


        // Створюємо нову картку
        const newCard =
            createRomanceCard(
                book,
                quantity
            );


        // Замінюємо тільки цю картку
        oldCard.replaceWith(newCard);


        // Оновлюємо напис кошика
        BookWorld.updateCartLinks();

    }


    // ==========================================
    // ПЕРВИННЕ ВІДОБРАЖЕННЯ КНИГ
    // ==========================================

    async function renderRomanceBooks() {

        const container =
            document.getElementById("books");


        container.innerHTML =
            "<p>📚 Завантаження книг...</p>";


        const books =
            await getRomanceBooks();


        const cart =
            await BookWorld.getCart();


        container.innerHTML = "";


        // Якщо книг немає
        if (books.length === 0) {

            container.innerHTML =
                "<p>У цьому жанрі поки немає книг.</p>";

            BookWorld.updateCartLinks();

            return;

        }


        // Створюємо всі картки тільки під час
        // початкового завантаження сторінки
        books.forEach(book => {

            const quantity =
                cart[book.book_code] || 0;


            const card =
                createRomanceCard(
                    book,
                    quantity
                );


            container.appendChild(card);

        });


        BookWorld.updateCartLinks();

    }


    // ==========================================
    // ДОДАТИ ДО КОШИКА
    // ==========================================

    async function addRomanceBook(
        id,
        card
    ) {

        const success =
            await BookWorld.addToCart(id);


        if (!success) {
            return;
        }


        // Оновлюємо тільки одну картку
        await updateRomanceCard(
            id,
            card
        );

    }


    // ==========================================
    // ПРИБРАТИ З КОШИКА
    // ==========================================

    async function removeRomanceBook(
        id,
        card
    ) {

        const success =
            await BookWorld.removeFromCart(id);


        if (!success) {
            return;
        }


        // Оновлюємо тільки одну картку
        await updateRomanceCard(
            id,
            card
        );

    }


    // ==========================================
    // ЗАПУСК
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            BookWorld.updateCartLinks();

            renderRomanceBooks();

        }
    );

</script>

</body>
</html>
