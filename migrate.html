// ==========================================
// ВИВЕДЕННЯ ПОВІДОМЛЕННЯ
// ==========================================

function log(message) {

    const logBox =
        document.getElementById("log");


    const line =
        document.createElement("div");


    line.textContent =
        message;


    logBox.appendChild(line);


    logBox.scrollTop =
        logBox.scrollHeight;

}


// ==========================================
// ЗМІНА СТАТУСУ
// ==========================================

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent = message;

}


// ==========================================
// ЧИСЛОВЕ ПОЛЕ
// ==========================================

function numberOrNull(value) {

    /*
     * Якщо поле порожнє —
     * передаємо null.
     */

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return null;

    }


    const cleaned =
        String(value)
            .replace(",", ".")
            .trim();


    if (cleaned === "") {

        return null;

    }


    const number =
        Number(cleaned);


    if (Number.isNaN(number)) {

        return null;

    }


    return number;

}


// ==========================================
// ПЕРЕВІРКА ПІДКЛЮЧЕННЯ
// ==========================================

function checkSupabaseConnection() {

    if (!migrationDB) {

        throw new Error(
            "Supabase не підключено."
        );

    }

}


// ==========================================
// ПЕРЕВІРКА АДМІНІСТРАТОРА
// ==========================================

async function checkAdmin() {

    checkSupabaseConnection();


    const {
        data: {
            session
        }
    } =
        await migrationDB.auth.getSession();


    if (!session) {

        throw new Error(
            "Ти не увійшов у свій акаунт."
        );

    }


    const {
        data: profile,
        error
    } =
        await migrationDB
            .from("profiles")
            .select("role")
            .eq(
                "id",
                session.user.id
            )
            .single();


    if (error) {

        throw error;

    }


    if (
        !profile ||
        profile.role !== "admin"
    ) {

        throw new Error(
            "У тебе немає прав адміністратора."
        );

    }

}


// ==========================================
// ПЕРЕНЕСЕННЯ ЖАНРІВ
// ==========================================

async function migrateGenres() {

    log(
        "📚 Перевіряємо жанри..."
    );


    const genreMap = {};


    for (
        const genre
        of standardGenres
    ) {

        const {
            data: existing,
            error: findError
        } =
            await migrationDB
                .from("genres")
                .select("id")
                .eq(
                    "code",
                    genre.code
                )
                .maybeSingle();


        if (findError) {

            throw findError;

        }


        let genreId;


        // Якщо жанр вже існує
        if (existing) {

            genreId =
                existing.id;


            log(
                `✔ Жанр вже існує: ${genre.name}`
            );

        }

        // Якщо жанру ще немає
        else {

            const {
                data: created,
                error: insertError
            } =
                await migrationDB
                    .from("genres")
                    .insert({

                        name:
                            genre.name,

                        code:
                            genre.code

                    })
                    .select("id")
                    .single();


            if (insertError) {

                throw insertError;

            }


            genreId =
                created.id;


            log(
                `➕ Додано жанр: ${genre.name}`
            );

        }


        genreMap[
            genre.code
        ] = genreId;

    }


    return genreMap;

}


// ==========================================
// ПЕРЕНЕСЕННЯ СТАНДАРТНИХ КНИГ
// ==========================================

async function migrateStandardBooks(
    genreMap
) {

    log(
        "📖 Переносимо стандартні книги..."
    );


    // Старі видалені книги
    const deletedBooks =
        JSON.parse(
            localStorage.getItem(
                "deletedStandardBooks"
            ) || "[]"
        );


    // Старі редагування книг
    const bookEdits =
        JSON.parse(
            localStorage.getItem(
                "bookEdits"
            ) || "{}"
        );


    for (
        const book
        of standardBooks
    ) {

        const edited =
            bookEdits[
                book.id
            ] || {};


        const isDeleted =
            deletedBooks.includes(
                book.id
            );


        const genreCode =
            edited.genre ??
            book.genre;


        const bookData = {

            book_code:
                book.id,

            title:
                edited.title ??
                book.title ??
                "",

            author:
                edited.author ??
                book.author ??
                "",

            genre_id:
                genreMap[
                    genreCode
                ] || null,

            description:
                edited.description ??
                book.description ??
                "",

            image_url:
                edited.image_url ??
                book.image_url ??
                "",

            price:
                numberOrNull(
                    edited.price ??
                    book.price
                ),

            year:
                numberOrNull(
                    edited.year ??
                    book.year
                ),

            pages:
                numberOrNull(
                    edited.pages ??
                    book.pages
                ),

            rating:
                numberOrNull(
                    edited.rating ??
                    book.rating
                ),

            language:
                edited.language ??
                book.language ??
                "",

            publisher:
                edited.publisher ??
                book.publisher ??
                "",

            isbn:
                edited.isbn ??
                book.isbn ??
                "",

            series:
                edited.series ??
                book.series ??
                "",

            buy_link:
                edited.buy_link ??
                book.buy_link ??
                "",

            is_deleted:
                isDeleted,

            updated_at:
                new Date().toISOString()

        };


        const {
            error
        } =
            await migrationDB
                .from("books")
                .upsert(
                    bookData,
                    {
                        onConflict:
                            "book_code"
                    }
                );


        if (error) {

            throw error;

        }


        if (isDeleted) {

            log(
                `🗑️ ${book.title} — видалена`
            );

        }

        else {

            log(
                `✔ ${book.title}`
            );

        }

    }

}


// ==========================================
// ПЕРЕНЕСЕННЯ ВЛАСНИХ КНИГ
// ==========================================

async function migrateCustomBooks(
    genreMap
) {

    log(
        "📚 Переносимо додані книги..."
    );


    const customBooks =
        JSON.parse(
            localStorage.getItem(
                "myBooks"
            ) || "[]"
        );


    if (
        !customBooks.length
    ) {

        log(
            "ℹ️ Доданих користувачем книг немає."
        );

        return;

    }


    for (
        const book
        of customBooks
    ) {

        let bookCode =
            book.id ||
            book.book_code;


        // Якщо ID відсутній —
        // створюємо новий.
        if (!bookCode) {

            bookCode =
                "my-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);

        }


        const genreCode =
            book.genre ||
            book.genreCode ||
            "";


        const bookData = {

            book_code:
                bookCode,

            title:
                book.title ||
                "",

            author:
                book.author ||
                "",

            genre_id:
                genreMap[
                    genreCode
                ] || null,

            description:
                book.description ||
                "",

            image_url:
                book.image_url ||
                book.image ||
                "",

            price:
                numberOrNull(
                    book.price
                ),

            year:
                numberOrNull(
                    book.year
                ),

            pages:
                numberOrNull(
                    book.pages
                ),

            rating:
                numberOrNull(
                    book.rating
                ),

            language:
                book.language ||
                "",

            publisher:
                book.publisher ||
                "",

            isbn:
                book.isbn ||
                "",

            series:
                book.series ||
                "",

            buy_link:
                book.buy_link ||
                book.buyLink ||
                "",

            is_deleted:
                false,

            updated_at:
                new Date().toISOString()

        };


        const {
            error
        } =
            await migrationDB
                .from("books")
                .upsert(
                    bookData,
                    {
                        onConflict:
                            "book_code"
                    }
                );


        if (error) {

            throw error;

        }


        log(
            `✔ ${book.title}`
        );

    }

}

        // Перевіряємо адміністратора
        log(

        await checkAdmin();


        log(
            "✔ Права адміністратора підтверджено."
        );


        log("");


        // Переносимо жанри
        const genreMap =
            await migrateGenres();


        log("");


        // Переносимо стандартні книги
        await migrateStandardBooks(
            genreMap
        );


        log("");


        // Переносимо власні книги
        await migrateCustomBooks(
            genreMap
        );


        log("");


        log(
            "🎉 МІГРАЦІЮ ЗАВЕРШЕНО!"
        );


        setStatus(
            "✅ Книги та жанри успішно перенесено."
        );


    }

    catch (error) {

        console.error(
            "Помилка міграції:",
            error
        );


        log("");


        log(
            "❌ ПОМИЛКА: " +
            (error.message ||
            "Невідома помилка")
        );


        setStatus(
            "❌ Міграцію завершено з помилкою."
        );


        // Дозволяємо повторити
        button.disabled =
            false;

    }

}


// ==========================================
// КНОПКА МІГРАЦІЇ
// ==========================================

document
    .getElementById(
        "start-button"
    )
    .addEventListener(
        "click",
        startMigration
    );

</script>
