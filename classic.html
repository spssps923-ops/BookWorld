<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Класика — BookWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        📚 BookWorld
    </div>

    <div>

        <a href="index.html" class="cart-button">
            🏠 Головна
        </a>

        <a href="cart.html" class="cart-button" id="cart-link">
            🛒 Кошик
        </a>

    </div>

</header>


<main>

    <h1>📚 Класика</h1>

    <p class="description">
        Відомі твори, які залишили важливий слід у світовій літературі
    </p>

    <div class="books-grid" id="books"></div>

</main>


<footer>
    BookWorld © 2026
</footer>


<!-- ==========================================
     SUPABASE
     ========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- ==========================================
     ОСНОВНИЙ СКРИПТ BOOKWORLD
     ========================================== -->

<script src="script.js"></script>


<script>

    // ==========================================
    // ОТРИМАННЯ КНИГ КЛАСИКИ
    // ==========================================

    async function getClassicBooks() {

        try {

            const dbClassic =
                window.BookWorldSupabase;


            // Знаходимо жанр за кодом
            const { data: genre, error: genreError } =
                await dbClassic
                    .from("genres")
                    .select("id")
                    .eq("code", "classic")
                    .single();


            if (genreError) {

                console.error(
                    "Помилка отримання жанру:",
                    genreError
                );

                return [];

            }


            // Отримуємо книги цього жанру
            const { data: books, error: booksError } =
                await dbClassic
                    .from("books")
                    .select("*")
                    .eq("genre_id", genre.id)
                    .eq("is_deleted", false)
                    .order("created_at", {
                        ascending: true
                    });


            if (booksError) {

                console.error(
                    "Помилка отримання книг:",
                    booksError
                );

                return [];

            }


            return books || [];

        }

        catch (error) {

            console.error(
                "Помилка Supabase:",
                error
            );

            return [];

        }

    }


    // ==========================================
    // СТВОРЕННЯ КАРТКИ КНИГИ
    // ==========================================

    function createClassicCard(book, quantity) {

        const bookId =
            book.book_code;


        // ==========================================
        // ОБКЛАДИНКА
        // ==========================================

        let cover =
            book.image_url || "📖";


        if (
            typeof cover === "string" &&
            (
                cover.startsWith("http://") ||
                cover.startsWith("https://")
            )
        ) {

            cover = `
                <img
                    src="${escapeClassicHTML(cover)}"
                    alt="${escapeClassicHTML(book.title || "Обкладинка книги")}"
                >
            `;

        }


        // ==========================================
        // КАРТКА
        // ==========================================

        const card =
            document.createElement("div");


        card.className =
            "book-card";


        card.dataset.bookId =
            bookId;


        card.innerHTML = `

            <div class="book-cover">
                ${cover}
            </div>

            <h2>
                ${escapeClassicHTML(book.title || "Без назви")}
            </h2>

            <p>
                ${escapeClassicHTML(book.author || "Автор невідомий")}
            </p>

            ${
                book.price != null
                    ? `
                        <p class="book-price">
                            ${book.price} грн
                        </p>
                    `
                    : ""
            }

            <button
                class="add-to-cart"
                type="button"
            >
                🛒 Додати до кошика
                ${quantity > 0 ? `(${quantity})` : ""}
            </button>

            ${
                quantity > 0
                    ? `
                        <button
                            class="remove-from-cart"
                            type="button"
                        >
                            ➖ Прибрати одну
                        </button>
                    `
                    : ""
            }

        `;


        // ==========================================
        // КНОПКА ДОДАВАННЯ
        // ==========================================

        const addButton =
            card.querySelector(".add-to-cart");


        addButton.addEventListener(
            "click",
            async function (event) {

                event.stopPropagation();

                await addClassicBook(
                    bookId,
                    card
                );

            }
        );


        // ==========================================
        // КНОПКА ВИДАЛЕННЯ
        // ==========================================

        const removeButton =
            card.querySelector(".remove-from-cart");


        if (removeButton) {

            removeButton.addEventListener(
                "click",
                async function (event) {

                    event.stopPropagation();

                    await removeClassicBook(
                        bookId,
                        card
                    );

                }
            );

        }


        // ==========================================
        // ПЕРЕХІД НА СТОРІНКУ КНИГИ
        // ==========================================

        card.addEventListener(
            "click",
            function () {

                window.location.href =
                    "book.html?id=" +
                    encodeURIComponent(bookId);

            }
        );


        return card;

    }


    // ==========================================
    // БЕЗПЕЧНИЙ ВИВІД ТЕКСТУ
    // ==========================================

    function escapeClassicHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // ПОЧАТКОВЕ ВІДОБРАЖЕННЯ КНИГ
    // ==========================================

    async function renderClassicBooks() {

        const container =
            document.getElementById("books");


        container.innerHTML =
            "<p>📚 Завантаження книг...</p>";


        const books =
            await getClassicBooks();


        const cart =
            await BookWorld.getCart();


        container.innerHTML = "";


        // Якщо книг немає
        if (books.length === 0) {

            container.innerHTML =
                "<p>У цьому жанрі поки немає книг.</p>";

            BookWorld.updateCartLinks();

            return;

        }


        // Створюємо картки
        books.forEach(function (book) {

            const bookId =
                book.book_code;


            const quantity =
                cart[bookId] || 0;


            const card =
                createClassicCard(
                    book,
                    quantity
                );


            container.appendChild(card);

        });


        BookWorld.updateCartLinks();

    }


    // ==========================================
    // ОНОВЛЕННЯ ТІЛЬКИ ОДНІЄЇ КАРТКИ
    // ==========================================

    async function updateClassicCard(
        id,
        oldCard
    ) {

        const dbClassic =
            window.BookWorldSupabase;


        // Отримуємо актуальну книгу
        const { data: book, error } =
            await dbClassic
                .from("books")
                .select("*")
                .eq("book_code", id)
                .eq("is_deleted", false)
                .single();


        if (error || !book) {

            console.error(
                "Не вдалося оновити картку:",
                error
            );

            return;

        }


        // Отримуємо актуальний кошик
        const cart =
            await BookWorld.getCart();


        const quantity =
            cart[id] || 0;


        // Створюємо нову картку
        const newCard =
            createClassicCard(
                book,
                quantity
            );


        // Замінюємо тільки цю картку
        oldCard.replaceWith(newCard);


        // Оновлюємо кількість товарів у кошику
        BookWorld.updateCartLinks();

    }


    // ==========================================
    // ДОДАТИ ДО КОШИКА
    // ==========================================

    async function addClassicBook(
        id,
        card
    ) {

        await BookWorld.addToCart(id);


        // Не перебудовуємо всю сторінку
        await updateClassicCard(
            id,
            card
        );

    }


    // ==========================================
    // ПРИБРАТИ ОДНУ КНИГУ
    // ==========================================

    async function removeClassicBook(
        id,
        card
    ) {

        await BookWorld.removeFromCart(id);


        // Не перебудовуємо всю сторінку
        await updateClassicCard(
            id,
            card
        );

    }


    // ==========================================
    // ЗАПУСК
    // ==========================================

    renderClassicBooks();

</script>

</body>
</html>
